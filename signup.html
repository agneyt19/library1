<body bgcolor="#dff9fb">
<table align="right" bgcolor="#2c3e50" cellpadding="6" cellspacing="0">
  <tr>
    <td>
      <font size="2">
      <a href="login.html"><font color="#ff7675"><b>Login</b></font></a>
      &nbsp;|&nbsp;
      <a href="signup.html"><font color="#55efc4"><b>Sign Up</b></font></a>

      </font>
    </td>

<br clear="all">
<center>
<h1><font color="#00b894">Sign Up</font></h1>
<form action="login.html" method="post">
  <table bgcolor="#d5f5e3" border="2" bordercolor="#00b894" cellpadding="10" cellspacing="0">
    <tr>
      <td bgcolor="#a3e4d7"><b>Full Name</b></td>
      <td><input type="text" size="30" required></td>
    </tr>
    <tr>
      <td bgcolor="#a3e4d7"><b>Email</b></td>
      <td><input type="email" size="30" required></td>
    </tr>
    <tr>
      <td bgcolor="#a3e4d7"><b>Phone</b></td>
      <td><input type="tel" size="30"></td>
    </tr>
    <tr>
      <td bgcolor="#a3e4d7"><b>Role</b></td>
      <td>
        <select>
          <option>Student</option>
          <option>Teacher</option>
          <option>Librarian</option>
        </select>
      </td>
    </tr>
    <tr>
      <td bgcolor="#a3e4d7"><b>Password</b></td>
      <td><input type="password"  required></td>
    </tr>
    <tr>
      <td bgcolor="#a3e4d7"><b>Confirm Password</b></td>
      <td><input type="password"  required></td>
    </tr>
    <tr>
      <td colspan="2" align="center" bgcolor="#a3e4d7"><button type="submit">Create Account</button></td>
    </tr>
  </table>
</form>
<p>Already registered? <a href="login.html"><b>Login</b></a></p>
</center>
</body>
</html>
